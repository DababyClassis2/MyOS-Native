name: 'Build MyOS (Alpine)'
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-alpine:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build inside Alpine 3.18 container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace alpine:3.18 sh -c "
            set -ex
            apk update
            apk add --no-cache \
              rust cargo nodejs npm \
              libx11-dev libxrandr-dev \
              libxcb-dev gtk+3.0-dev \
              webkit2gtk \
              libsoup3-dev librsvg-dev \
              glib-dev dbus-dev gcc \
              musl-dev pkgconfig make \
              xdo openssl-dev

            rustup target add x86_64-unknown-linux-musl

            # Force pkg-config to find WebKit2GTK
            export PKG_CONFIG_PATH=/usr/lib/x86_64-linux-musl/pkgconfig/:/usr/lib/pkgconfig/
            cd /workspace/MyOS-Native
            npm install
            npm run tauri build -- --target x86_64-unknown-linux-musl
          "

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yfitops-os-alpine-binary
          path: MyOS-Native/src-tauri/target/x86_64-unknown-linux-musl/release/yfitops-os
