<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yfitops OS v8.0</title>
    <link rel="stylesheet" href="assets/theme.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-color: rgba(15, 15, 15, 0.9);
            --accent-color: #2ecc71;
            --text-color: #ffffff;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-family);
            background: linear-gradient(135deg, #0f0f12 0%, #1a1a1f 100%);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
        }

        #os-container {
            flex: 1;
            background: var(--bg-color);
            backdrop-filter: blur(30px);
            border-radius: 12px;
            margin: 10px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #top-bar {
            height: 35px;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            padding: 0 15px;
            font-size: 13px;
            font-weight: 600;
            border-top-left-radius: 12px;
            border-top-right-radius: 12px;
            -webkit-app-region: drag;
        }

        .top-bar-item { margin-right: 20px; cursor: pointer; -webkit-app-region: no-drag; }
        #clock { margin-left: auto; }

        #desktop {
            flex: 1;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            grid-gap: 25px;
            align-content: start;
        }

        .icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .icon:hover { transform: scale(1.1); }

        .icon-img {
            width: 64px;
            height: 64px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin-bottom: 10px;
            color: var(--accent-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .icon-label { font-size: 13px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        #dock-container {
            display: flex;
            justify-content: center;
            padding-bottom: 20px;
        }

        #dock {
            height: 65px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            width: fit-content;
        }

        .dock-item {
            width: 48px;
            height: 48px;
            margin: 0 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-size: 24px;
        }

        .dock-item:hover {
            transform: translateY(-15px) scale(1.3);
            background: var(--accent-color);
            color: #000;
        }
/* Status Widget */
#status-widget {
    position: absolute;
    bottom: 100px;
    right: 30px;
    background: var(--glass-bg);
    padding: 15px;
    border-radius: 15px;
    font-size: 12px;
    backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
}

/* Amnesic Mode Indicator */
#amnesic-indicator {
    display: none;
    color: #f1c40f;
    margin-left: 15px;
    font-weight: bold;
    text-shadow: 0 0 10px rgba(241, 196, 15, 0.5);
}
</style>
</head>
<body>
<div id="os-container">
<div id="top-bar">
    <div class="top-bar-item"><i class="ph ph-apple-logo"></i></div>
    <div class="top-bar-item"><b>Yfitops</b></div>
    <div class="top-bar-item">Finder</div>
    <div class="top-bar-item">System</div>
    <div class="top-bar-item" onclick="toggleFocus()" id="focus-btn"><i class="ph ph-focus"></i> Focus Off</div>
    <div id="amnesic-indicator"><i class="ph ph-warning"></i> AMNESIC MODE</div>
    <div id="clock">12:00 PM</div></div>

        <div id="desktop">
            <div class="icon" onclick="openModule('terminal')">
                <div class="icon-img"><i class="ph ph-terminal-window"></i></div>
                <div class="icon-label">Terminal</div>
            </div>
            <div class="icon" onclick="openModule('activity')">
                <div class="icon-img"><i class="ph ph-activity"></i></div>
                <div class="icon-label">Activity</div>
            </div>
            <div class="icon" onclick="openModule('files')">
                <div class="icon-img"><i class="ph ph-folder-open"></i></div>
                <div class="icon-label">Files</div>
            </div>
            <div class="icon" onclick="openModule('notes')">
                <div class="icon-img"><i class="ph ph-notepad"></i></div>
                <div class="icon-label">Notes</div>
            </div>
            <div class="icon" onclick="openModule('settings')">
                <div class="icon-img"><i class="ph ph-gear"></i></div>
                <div class="icon-label">Settings</div>
            </div>
            <div class="icon" onclick="openModule('logs')">
                <div class="icon-img"><i class="ph ph-scroll"></i></div>
                <div class="icon-label">Logs</div>
            </div>
            <div class="icon" onclick="openModule('privacy')">
                <div class="icon-img"><i class="ph ph-shield-check"></i></div>
                <div class="icon-label">Privacy</div>
            </div>
        </div>

        <div id="status-widget">
            <div id="cpu-stat">CPU: --%</div>
            <div id="mem-stat">MEM: --/-- GB</div>
        </div>

        <div id="dock-container">
            <div id="dock">
                <div class="dock-item"><i class="ph ph-globe"></i></div>
                <div class="dock-item"><i class="ph ph-note-pencil"></i></div>
                <div class="dock-item"><i class="ph ph-music-note"></i></div>
                <div class="dock-item" onclick="openModule('terminal')"><i class="ph ph-terminal"></i></div>
                <div class="dock-item" style="color: var(--accent-color)"><i class="ph ph-apple-logo"></i></div>
            </div>
        </div>
    </div>

    <script>
        const { invoke } = window.__TAURI__.tauri;
        const { listen } = window.__TAURI__.event;
        const moduleId = 'desktop';

        // Listen for Theme Updates
        listen('theme:updated', (event) => {
            const palette = event.payload;
            document.documentElement.style.setProperty('--accent-color', palette.accent);
            // Additional theme updates if needed
        });

        // Listen for Session Mode Changes
        listen('session:mode_changed', (event) => {
            const mode = event.payload;
            const indicator = document.getElementById('amnesic-indicator');
            indicator.style.display = mode === 'Amnesic' ? 'block' : 'none';
        });

        // Listen for Focus Mode Changes
        listen('workspace:focus_mode_changed', (event) => {
            const isFocus = event.payload;
            document.getElementById('focus-btn').innerText = isFocus ? 'Focus On' : 'Focus Off';
            document.getElementById('os-container').style.opacity = isFocus ? '0.5' : '1';
        });

        async function toggleFocus() {
            try {
                await invoke('toggle_focus_mode', { moduleId });
            } catch (err) {
                console.error(err);
            }
        }

        function updateStats() {
            invoke('get_system_health', { moduleId }).then((stats) => {
                document.getElementById('cpu-stat').innerText = `CPU: ${stats.cpu_usage.toFixed(1)}%`;
                const used = (stats.memory_used / 1024 / 1024 / 1024).toFixed(1);
                const total = (stats.memory_total / 1024 / 1024 / 1024).toFixed(1);
                document.getElementById('mem-stat').innerText = `MEM: ${used}/${total} GB`;
            }).catch(console.error);
        }

        function openModule(targetId) {
            invoke('open_module', { moduleId, targetModuleId: targetId });
        }

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        setInterval(updateStats, 2000);
        setInterval(updateClock, 1000);
        updateStats();
        updateClock();
    </script>
</body>
</html>
