<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>YOS Notes</title>
    <link rel="stylesheet" href="../assets/module-style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: rgba(40, 40, 40, 0.95);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 10px;
        }

        #notes-container {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        #notes-sidebar {
            width: 200px;
            background: rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            padding: 10px;
        }

        #notes-editor {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .note-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-item:hover { background: rgba(255, 255, 255, 0.1); }
        .note-item.active { background: var(--accent-color); color: #000; }

        input#note-title {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            outline: none;
        }

        textarea#note-body {
            background: transparent;
            border: none;
            color: #ccc;
            font-size: 16px;
            flex: 1;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            padding: 10px;
            gap: 10px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.2); }
        .btn-save { background: var(--accent-color); color: #000; border: none; }
    </style>
</head>
<body>
    <div class="title-bar">
        <div class="traffic-lights">
            <div class="traffic-light close" onclick="window.close()"></div>
            <div class="traffic-light minimize"></div>
            <div class="traffic-light maximize"></div>
        </div>
        <div class="title-text">Notes</div>
    </div>

    <div class="toolbar">
        <button class="btn" onclick="newNote()">New Note</button>
        <button class="btn btn-save" onclick="saveNote()">Save</button>
        <button class="btn" style="color: #ff5f56" onclick="deleteNote()">Delete</button>
    </div>

    <div id="notes-container">
        <div id="notes-sidebar">
            <!-- Note list injected here -->
        </div>
        <div id="notes-editor">
            <input type="text" id="note-title" placeholder="Untitled Note">
            <textarea id="note-body" placeholder="Start writing..."></textarea>
        </div>
    </div>

    <script>
        const { invoke } = window.__TAURI__.tauri;
        const moduleId = 'notes';
        let currentNoteId = '';

        async function loadNotes() {
            try {
                const notes = await invoke('list_notes', { moduleId });
                const sidebar = document.getElementById('notes-sidebar');
                sidebar.innerHTML = notes.map(note => `
                    <div class="note-item ${note.id === currentNoteId ? 'active' : ''}" onclick="selectNote('${note.id}')">
                        ${note.title || 'Untitled'}
                    </div>
                `).join('');
                
                if (currentNoteId) {
                    const current = notes.find(n => n.id === currentNoteId);
                    if (current) {
                        document.getElementById('note-title').value = current.title;
                        document.getElementById('note-body').value = current.body;
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function selectNote(id) {
            currentNoteId = id;
            await loadNotes();
        }

        function newNote() {
            currentNoteId = '';
            document.getElementById('note-title').value = '';
            document.getElementById('note-body').value = '';
            loadNotes();
        }

        async function saveNote() {
            const title = document.getElementById('note-title').value;
            const body = document.getElementById('note-body').value;
            
            const note = {
                id: currentNoteId,
                title: title,
                body: body,
                is_pinned: false
            };

            try {
                await invoke('save_note', { moduleId, note });
                alert("Note saved!");
                await loadNotes();
            } catch (err) {
                alert("Error: " + err);
            }
        }

        async function deleteNote() {
            if (!currentNoteId) return;
            if (!confirm("Delete this note?")) return;

            try {
                await invoke('delete_note', { moduleId, id: currentNoteId });
                newNote();
            } catch (err) {
                alert("Error: " + err);
            }
        }

        loadNotes();
    </script>
</body>
</html>
